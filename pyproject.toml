[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "godbot"
version = "0.1.0"
description = "Local agent harness for Gemma via LM Studio"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "tomli_w>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.22",
    "tree-sitter-language-pack>=0.7,<1.0",
    "mss>=9.0",
    "pyperclip>=1.8",
    "Pillow>=10.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "jsonschema>=4.0",
]
discord = [
    "discord.py>=2.4",
]

[project.scripts]
godbot-web = "godbot.interfaces.web:main"
godbot-cli = "godbot.interfaces.cli:main"
godbot-tui = "godbot.interfaces.tui:main"
godbot-index = "godbot.index:main"
godbot-discord = "godbot.interfaces.discord_bot.bot:main"

[tool.setuptools.packages.find]
include = ["godbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
